<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	  <title>Agenda Clínica</title>
	<!--Import Google Icon Font-->
      <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
      <!--Import materialize.css-->
      <link type="text/css" rel="stylesheet" href="materialize/css/materialize.min.css"  media="screen,projection"/>

      <!--Let browser know website is optimized for mobile-->
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <link rel="stylesheet" href="style/styleCss.css"/>

</head>
<body>
    <p>Fazer Login</p>
    <div id="IdLogin" class="">
	    <div class="modal-content">
	      <!-- Conteudo -->
		  <form  th:action="login"> <!--method="get" th:object="${convenio}"-->
				<div class=""> 
					  <div class="row"> 
					  		<div class="input-field col s6">
						  		Usuário: <input type="text" value="" class="form-control" id="usuario" name="nameUser"/>
						  	</div>
							<div class="input-field col s6">
								Senha: <input type="password" value="" class="form-control" id="senha" name="passwordUser"/>
							</div>
					  </div>
					  <div class="modal-footer">
					  	  <button class="btn waves-effect waves-light modal-action modal-close" type="submit">Entrar</button>
					      <a href="#!" class="modal-action modal-close waves-effect waves-green btn-flat">Esqueci a senha</a>
					  </div>
			   </div> 
		  </form>
	    </div>
	</div>
    <script src="jquery/jquery-3.2.1.js"></script>
	 <script src="jquery/main.js"></script>
    <script type="text/javascript" src="materialize/js/materialize.min.js"></script>
</body>
</html>
